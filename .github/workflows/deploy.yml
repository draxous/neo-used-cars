name: Deploy to Cloudflare Pages

# Deploys straight from CI with wrangler. Cloudflare's own build pipeline is
# deliberately not used: its Workers Builds framework detection insists on
# rewriting vite.config.ts and fails on this project's config.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      # A missing key doesn't fail the build, it just inlines an empty string —
      # the site then deploys looking healthy and fails only at sign-in.
      - name: Check required secrets are set
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          missing=""
          [ -n "$VITE_SUPABASE_URL" ] || missing="$missing VITE_SUPABASE_URL"
          [ -n "$VITE_SUPABASE_ANON_KEY" ] || missing="$missing VITE_SUPABASE_ANON_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing"
            exit 1
          fi

      # Vite inlines VITE_* at build time, so these must be present HERE —
      # setting them in the Cloudflare dashboard has no effect on this build.
      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_WEB3FORMS_ACCESS_KEY: ${{ secrets.VITE_WEB3FORMS_ACCESS_KEY }}

      # Match the project URL itself: the string "supabase.co" ships inside
      # @supabase/supabase-js, so looking for that passes even with no config.
      - name: Verify config reached the bundle
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
        run: |
          if ! grep -qF "$VITE_SUPABASE_URL" dist/assets/*.js; then
            echo "::error::VITE_SUPABASE_URL did not reach the bundle."
            exit 1
          fi
          echo "Supabase project URL present in bundle."

      # Harmless once the project exists; only does anything on the first run.
      - name: Ensure Pages project exists
        uses: cloudflare/wrangler-action@v3
        continue-on-error: true
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages project create neo-used-cars --production-branch=main

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=neo-used-cars --branch=main
